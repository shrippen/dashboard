conn:
  options_hint_jsonapi: 'URL einer JSON-Antwort. Optionen: header: X-Api-Key (sonst Authorization: Bearer <Token>). Token optional. Felder mit eigenen Regeln prüfen, z. B. stats.users.'
  options_hint_pihole: Keine Optionen. Token = App-Passwort (Pi-hole v6) bzw. API-Token (v5).
  options_hint_adguard: Keine Optionen. Token = benutzer:passwort.
  options_hint_nextcloud: 'Keine Optionen. Token = serverinfo-Token (occ config:app:set serverinfo token --value …) oder admin:app-passwort.'
  options_hint_sabnzbd: Keine Optionen. Token = API-Schlüssel (Konfiguration → Allgemein).
  options_hint_gluetun: 'URL des Control-Servers (http://gluetun:8000). Optionen: country: Sweden (erwartetes Ausgangsland). Token = API-Schlüssel, falls gesetzt.'
  options_hint_domains: 'URL = eine Adresse der Domain. Optionen: domains: [example.org, example.de]. Kein Token. .de nennt kein Ablaufdatum.'
  options_hint_blacklist: 'URL = Mailserver (dessen IPv4-Adressen werden geprüft). Optionen: ips: [1.2.3.4], zones: [zen.spamhaus.org]. Kein Token.'
  options_hint_truenas: Keine Optionen. Token = API-Schlüssel (Benutzer → API-Schlüssel). Nutzt die WebSocket-API, ältere Versionen REST.
  options_hint_komodo: Keine Optionen. Token = key:secret eines Komodo-API-Schlüssels (nur lesend genügt).
  options_hint_pangolin: 'URL der Integration-API inkl. /v1 (z. B. https://api.pangolin.example.org/v1). Optionen: org: <Organisations-ID>. Token = Integration-API-Schlüssel.'
  options_hint_authentik: Keine Optionen. Token = API-Token eines Kontos mit Leserechten auf Ereignisse und Benutzer.
  options_hint_mail: 'URL imaps://mail.example.org:993/INBOX, Token benutzer:app-passwort. Optionen: days: 60, keywords: [abrechnung], ignore_senders: [meinefirma.de] – nur lesend; Anhänge werden nur geladen, wenn du eine Rechnung an Paperless übergibst.'
  options_hint_pgbackweb: Keine Optionen, kein Token. PG Back Web meldet sich per Webhook, siehe unten.
  hook: Webhook
  hook_hint: 'In PG Back Web je Ereignis (execution_success, execution_failed, database_unhealthy/healthy, destination_unhealthy/healthy) und Backup einen Webhook anlegen: Methode POST, diese URL, Body wie unten mit Ereignis und Backup-Name. Die URL ist geheim.'
  options_hint_linkwarden: 'collections: [Homelab, Werkzeuge] – Sammlungen, die mit den Link-Kacheln dieses Bereichs abgeglichen werden (leer = alle). Token = Zugriffstoken (Einstellungen → Zugriffstoken).'
  options_hint_sure: Keine Optionen nötig. Token = API-Schlüssel mit Leserecht (Einstellungen → API-Schlüssel).
  options_hint_homeassistant: Keine Optionen nötig. Token = langlebiges Zugriffstoken (Profil → Sicherheit). Schalten dürfen nur Nutzer mit Recht „nutzen“ an dieser Verbindung.
  options_hint_freshrss: 'Keine Optionen nötig. Token = benutzer:api-passwort (FreshRSS → Profil → API-Passwort; API-Zugriff muss erlaubt sein).'
  options_hint_gitea: Keine Optionen nötig. Token = Zugriffstoken mit Leserechten (read:user, read:issue, read:repository, read:notification).
  options_hint_borgbackup: Keine Optionen nötig. Token = API-Token bbs_tok_… (Einstellungen → API).
  options_hint_scrutiny: Keine Optionen, kein Token nötig.
  options_hint_immich: Keine Optionen nötig. Token = API-Schlüssel (Konto → API-Schlüssel); Statistik und Jobs brauchen einen Admin-Schlüssel.
  options_hint_umami: 'Keine Optionen nötig. Token = benutzer:passwort (selbst gehostet) oder API-Schlüssel (Umami Cloud).'
  options_hint_uptimekuma: Keine Optionen nötig. Token = API-Schlüssel aus Uptime Kuma (Einstellungen → API-Schlüssel).
  options_hint_proxmox: 'Keine Optionen nötig. Token = user@pam!name=uuid, Rechte: PVEAuditor, für Updates Sys.Audit.'
  options_hint_paperless: 'Token aus Paperless (Profil → API-Auth-Token). Optional invoice_types: [Rechnung] – Dokumenttypen, die mit Invoice-Ninja-Ausgaben abgeglichen werden; Betrag aus einem Geld-Feld. Optional contract_tag: Vertrag – Verträge mit Feldern „Vertragsende“ und „Kündigungsfrist“ (sonst aus dem Text).'
  options_hint_certs: 'hosts: [shop.example.org, mail.example.org:993] – geprüft werden URL-Host und diese Hosts. Mit auto: true zusätzlich alle https-Kacheln und Pangolin-Ressourcen. Kein Token nötig.'
  lead: Verbindungen zu Diensten. Tokens werden verschlüsselt gespeichert und nie wieder angezeigt.
