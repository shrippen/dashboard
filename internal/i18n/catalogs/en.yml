hint:
  mail:
    unrecorded:
      title: 'Invoice from {sender} not in Invoice Ninja'
      why: '“{subject}” on {day}, amount {amount}. Record it as an expense or exclude the sender.'
  pgbackweb:
    failed:
      title: 'Backup “{backup}” failed'
      why: 'Latest run on {day} failed. Check the log in PG Back Web.'
    stale:
      title: 'Backup “{backup}” without success for {hours} hours'
      why: Schedule paused or success webhook missing?
    unhealthy:
      title: '{name} ({kind}) unreachable'
      why: 'Since {day}. No backups run without a connection.'
    silent:
      title: No reports from PG Back Web
      why: 'No webhook for {days} days. Webhooks set up, dashboard reachable?'
  linkwarden:
    missing:
      title: '{count} links from “{collection}” missing on the dashboard'
      why: '{names}. Add a tile or drop them in Linkwarden.'
    unsaved:
      title: '{count} tiles not saved in Linkwarden'
      why: '{names}.'
  sure:
    missed:
      title: 'Expected payment “{name}” missing'
      why: '{amount} was expected on {day}. Failed debit or changed contract?'
    low:
      title: '{account}: only {amount}'
      why: Balance below threshold. Move money before debits bounce.
    sync:
      title: 'Bank sync failed: {name}'
      why: Renew the bank connection or transactions will be missing.
    uncategorized:
      title: '{count} transactions without category'
      why: Budgets and reports are off without categories.
    unusual:
      title: 'Large expense: {name} ({amount})'
      why: 'On {day}, well above the usual. Double charge or price increase?'
  cross:
    invoice_paid:
      title: 'Invoice {number} probably paid'
      why: '{amount} from {client} arrived on {day} in {account}, still open in Invoice Ninja. Record the payment.'
    expense_unrecorded:
      title: 'Expense missing in Invoice Ninja: {name}'
      why: '{amount} on {day} from {account}. Record it if it is a business expense.'
  hass:
    alarm:
      title: '{entity} reports an alarm'
      why: 'Sensor class {kind}. Check on site now.'
    battery:
      title: '{entity}: battery {percent} %'
      why: Replace the battery before the device drops out.
    unavailable:
      title: '{count} entities unavailable'
      why: '{names}. Usual cause: a gateway, Zigbee stick or integration is down.'
    updates:
      title: '{count} updates in Home Assistant'
      why: '{names}.'
  freshrss:
    backlog:
      title: '{count} unread articles'
      why: 'Largest sources: {feeds}. Unsubscribe, filter or mark as read.'
    stale:
      title: 'Feed “{feed}” went silent'
      why: 'Last article on {day}. Moved or discontinued?'
  gitea:
    review:
      title: 'Review waiting: {repo}#{number}'
      why: '“{title}” has waited {days} days for you.'
    due:
      title: 'Due {day}: {repo}#{number}'
      why: '“{title}” is assigned to you.'
    stale_pr:
      title: 'PR {repo}#{number} idle for {days} days'
      why: '“{title}”: finish or close it.'
    actions:
      title: 'Build failed in {repo}'
      why: 'Latest run: {run}.'
    mirror:
      title: 'Mirror {repo} not updated since {day}'
      why: Source reachable? Credentials expired?
  borg:
    client_error:
      title: 'Backup client {client} reports an error'
      why: Check Borg Backup Server.
    client_offline:
      title: 'Backup client {client} offline since {day}'
      why: Device off, agent stopped or network down.
    failed:
      title: '{count} failed backup jobs (24 h)'
      why: '{ok} succeeded. Check the cause in the queue.'
    old:
      title: 'Last backup {hours} hours ago'
      why: Check schedules and agents.
    storage:
      title: 'Backup storage {percent} % full'
      why: Shorten retention, compact or add storage.
    update:
      title: Borg Backup Server update
      why: 'Server or {agents} agents outdated.'
  scrutiny:
    failed:
      title: 'Disk {disk} reports errors'
      why: '{model}, {hours} power-on hours. Back up and plan a replacement.'
