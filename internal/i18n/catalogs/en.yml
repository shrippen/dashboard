  options_hint_gitea: No options needed. Token = access token with read scopes (read:user, read:issue, read:repository, read:notification).
  options_hint_borgbackup: No options needed. Token = API token bbs_tok_… (settings → API).
  options_hint_scrutiny: No options, no token needed.
  options_hint_immich: No options needed. Token = API key (account → API keys); statistics and jobs need an admin key.
  options_hint_umami: 'No options needed. Token = user:password (self-hosted) or API key (Umami Cloud).'
  options_hint_uptimekuma: No options needed. Token = API key from Uptime Kuma (Settings → API Keys).
  options_hint_proxmox: 'No options needed. Token = user@pam!name=uuid, role PVEAuditor, Sys.Audit for updates.'
  options_hint_paperless: 'Token from Paperless (profile → API auth token). Optional invoice_types: [Invoice] – document types compared with Invoice Ninja expenses; amount from a monetary field.'
  options_hint_certs: 'hosts: [shop.example.org, mail.example.org:993] – checks the URL host and these hosts. No token needed.'
