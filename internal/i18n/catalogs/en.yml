mode_switch:
  title: Switch credentials
  to_personal: Switch to personal credentials?
  to_shared: Switch to shared credentials?
  personal_others: Everyone else who sees tiles of this connection then needs their own token (under “My credentials”). Until then their tiles show “credentials missing”.
  personal_mine: The current shared token becomes your personal one, so the connection keeps working for you.
  personal_jobs: Analyses and hints then run per person with their own token.
  share_mine: Use my personal token for everyone (there is no shared one yet).
  no_token: There is no shared token yet. Enter one after switching, or the connection works for nobody.
  secret_dropped: The token you just entered was not saved yet. Please enter it again after switching.
  confirm: Switch
