conn:
  options_hint_calendar: 'Public calendar: just the iCal address. Private calendar: the secret iCal address goes into “Private iCal address” (stored encrypted), above any address of the calendar. Events whose title names a Kimai customer or project are compared with the bookings.'
  about_calendar: 'Appointments against bookings'
  options_hint_tailscale: 'URL https://api.tailscale.com (token = API access token, admin console → settings → keys; expires after 90 days at most) or the Headscale URL (token = API key, headscale apikeys create). Options: tailnet: example.com (Tailscale, else the default tailnet).'
  about_tailscale: 'Devices, key expiry, updates'
  options_hint_gateway: 'Options: kind: opnsense | pfsense | unifi. OPNsense: token = key:secret of an API key. pfSense: REST API package, token = API key. UniFi: integration API key (Settings → Control Plane → Integrations), console URL. For pfSense and UniFi leave “API key” empty and put the key into “API secret”.'
  about_gateway: 'WAN, devices, firmware updates'
  options_hint_mediaserver: 'Options: kind: jellyfin | plex (default jellyfin). Token = Jellyfin API key (dashboard → API keys, admins only) or the server owner''s X-Plex-Token.'
  about_mediaserver: 'Running streams, library'
  options_hint_arr: 'No options. Token = API key (Settings → General). Sonarr or Radarr is detected.'
  about_arr: 'Health, queue, upcoming'
  options_hint_vaultwarden: 'No options. Token = ADMIN_TOKEN in plain text, as typed on /admin. Reads the user list only.'
  about_vaultwarden: 'Users and two-factor login'
  options_hint_speedtest: 'Speedtest Tracker: token = API token (v1 API), without a token the old open endpoint. MySpeed: URL of the MySpeed UI, a password only if one is set; expected speeds come from MySpeed. Options: expect_down: 250, expect_up: 40 (Mbit/s per contract) override them.'
  about_speedtest: 'Latest result against expectation'
  options_hint_grocy: 'No options. Token = API key (Settings → Manage API keys).'
  about_grocy: 'Stock, shopping list, chores'
  options_hint_dwd: 'URL https://api.brightsky.dev, no token. Pick the place with the search: Andon shows the German Weather Service warnings for its coordinates.'
  about_dwd: 'Weather warnings for a place'
  options_hint_github: 'URL https://api.github.com. Options: repos: [owner/repo]. Token optional (fine-grained, read: actions, contents, issues, pull requests; notifications need a classic token).'
  about_github: 'Repos: PRs, issues, CI, releases'
  options_hint_tibber: 'URL https://api.tibber.com/v1-beta/gql. Token = personal access token (developer.tibber.com). Optionally pick the place with the search: its daily temperatures adjust consumption for the weather. With Home Assistant the energy widget also shows the current power.'
  about_tibber: 'Electricity prices and cost'
