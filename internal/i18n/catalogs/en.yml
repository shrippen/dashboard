  options_hint_jsonapi: 'URL of a JSON response, token optional. Options (YAML): header: X-Api-Key (else Authorization: Bearer <token>); fields: [{label: Queue, path: stats.queue, warn: 10, critical: 50}] for key figures and hints; list: {path: jobs, columns: [name, state], limit: 10} for a table. The "Own integration" widget shows both; custom rules can test any field.'
  options_hint_pihole: No options. Token = app password (Pi-hole v6) or API token (v5).
  options_hint_adguard: No options. User name and password of the AdGuard Home account.
  options_hint_nextcloud: 'No options. User name and app password of an admin account (settings → security → app password). Or leave the user name empty and put the serverinfo token into the password field (occ config:app:set serverinfo token --value …).'
  options_hint_sabnzbd: No options. Token = API key (Config → General).
  options_hint_gluetun: 'Control server URL (http://gluetun:8000). Options: country: Sweden (expected exit country). Token = API key, if set.'
  options_hint_domains: 'URL = any address of the domain. Options: domains: [example.org, example.de]. No token. .de publishes no expiry.'
  options_hint_blacklist: 'URL = mail server (its IPv4 addresses are checked). Options: ips: [1.2.3.4], zones: [zen.spamhaus.org]. No token.'
  options_hint_truenas: 'No options. URL with https:// (e.g. https://truenas.lan) – TrueNAS revokes an API key used over http; with a self-signed certificate set TLS to “insecure”. Token = API key (credentials → users → API keys) of a user with the “Readonly Admin” role. Uses the WebSocket API, older versions REST.'
  options_hint_komodo: No options. API key and secret from Komodo (read-only suffices).
  options_hint_pangolin: 'Integration API URL including /v1 (e.g. https://api.pangolin.example.org/v1), not the Pangolin dashboard: enable the integration API in Pangolin''s config.yml (flags: enable_integration_api: true) and expose it on its own domain (port 3003). The organisation ID is in the Pangolin URL (…/<org>/settings). Token = integration API key with read access to sites and resources.'
  options_hint_authentik: No options. Token = API token of an account allowed to read events and users.
  options_hint_mail: 'URL imaps://mail.example.org:993/INBOX. Username and app password of your mailbox (not your regular login password). Options: days: 60, keywords: [statement], ignore_senders: [mycompany.com] – read-only; attachments are downloaded only when you hand an invoice to Paperless.'
  options_hint_pgbackweb: No options, no token. PG Back Web reports by webhook, see below.
  hook: Webhook
  hook_hint: 'In PG Back Web add one webhook per event (execution_success, execution_failed, database_unhealthy/healthy, destination_unhealthy/healthy) and backup: method POST, this URL, body as below with event and backup name. Keep the URL secret.'
  options_hint_linkwarden: 'collections: [Homelab, Tools] – collections compared with this space''s link tiles (empty = all). Token = access token (settings → access tokens).'
  options_hint_kintsugi: 'No options needed. Token = API token from Kintsugi → Einstellungen → API-Token (read-only, shown once). URL = address of the Kintsugi web UI.'
  options_hint_sure: No options needed. Token = API key with read scope (settings → API keys).
  options_hint_homeassistant: 'No options needed. Token = long-lived access token (profile → security). It has all rights of its user: best a dedicated user without admin rights. Only users with the “use” right on this connection may switch.'
  options_hint_freshrss: 'No options needed. Username and API password from FreshRSS → profile → API password; API access must be enabled there.'
  options_hint_gitea: No options needed. Token = access token with read scopes (read:user, read:issue, read:repository, read:notification).
  options_hint_borgbackup: No options needed. Token = API token bbs_tok_… (settings → API).
  options_hint_scrutiny: No options, no token needed.
  options_hint_immich: 'No options needed. Token = API key (account settings → API keys). Permissions: server.storage (required); optional server.statistics and job.read (only with an admin account''s key) and server.versionCheck for update hints.'
  options_hint_umami: 'No options needed. Self-hosted: user name and password of an Umami account. Umami Cloud: leave the user name empty and put the API key into the password field.'
  options_hint_uptimekuma: No options needed. Token = API key from Uptime Kuma (Settings → API Keys).
  options_hint_proxmox: 'No options needed. Token ID (e.g. root@pam!andon) and secret from Datacenter → Permissions → API tokens. Role PVEAuditor on path /; with “privilege separation” give the role to the token itself. Update hints need Sys.Audit.'
  options_hint_paperless: 'Token = API auth token (profile → API auth token). Rights follow the user: view documents, document types, tags, correspondents and custom fields; system status and tasks need an admin account. Optional invoice_types: [Invoice] – document types compared with Invoice Ninja expenses; amount from a monetary field. Optional contract_tag: Vertrag – contracts with fields "Vertragsende" and "Kündigungsfrist" (else read from the text).'
  options_hint_certs: 'hosts: [shop.example.org, mail.example.org:993] – checks the URL host and these hosts. With auto: true also every https tile and Pangolin resource. No token needed.'
  lead: Connections to services. Tokens are stored encrypted and never shown again.
