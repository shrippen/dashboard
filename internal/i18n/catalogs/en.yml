hint:
  kimai:
    timer_long:
      title: Timer running for {hours} h
      why: A running time entry exceeds the limit. Forgot to stop it?
    missing_day:
      title: No time recorded on {day}
      why: Workday without entries, no holiday or absence.
    unbilled:
      title: '{hours} h for {customer} not yet billed'
      why: Billable, unexported entries worth {amount}, oldest from {oldest} (limit {days} days).
    budget:
      title: Budget {project} {percent} % used
      why: The project's money or time budget is (almost) used up.
    pace:
      title: '{project}: budget will not last until {end}'
      why: At the pace of the last 30 days it reaches {forecast} instead of {budget}.
    utilization:
      title: Utilisation {percent} % (goal {goal} %)
      why: Billable hours this month compared with target time (without holidays and absences).
    overtime:
      title: '{hours} h per week on average'
      why: The last {weeks} weeks were above {limit} h.
    monthly_close:
      title: 'Month end {month}: {hours} h open'
      why: Billable entries of last month are not exported yet.
  in:
    overdue:
      title: Invoice {number} overdue for {days} days
      why: '{client}, open: {amount}.'
    overdue_dunning:
      title: 'Reminder due: {number} ({days} days)'
      why: '{client}, open: {amount}. Send a payment reminder.'
    slow_payer:
      title: '{client} pays after {days} days on average'
      why: Average time from invoice to payment is above {limit} days.
    draft_stale:
      title: Draft invoice for {client} since {days} days
      why: Draft worth {amount} has not been sent.
    quote_open:
      title: Quote {number} without reply ({days} days)
      why: '{client} has not replied yet. Follow up?'
    recurring_ending:
      title: Recurring invoice for {client} ends
      why: The last invoice goes out on {day}.
    revenue_goal:
      title: Revenue below annual goal
      why: So far {ytd} net, expected pro rata {expected} (goal {goal}).
    missing_vat_domestic:
      title: Invoice {number} without VAT
      why: 'Domestic client {client}: regular taxation requires VAT.'
    missing_vat_eu:
      title: 'Invoice {number}: VAT ID missing'
      why: '{client} is abroad and the invoice has no VAT. Reverse charge needs the client''s VAT ID.'
    expense_no_vat:
      title: Expense without input VAT ({amount})
      why: '{notes} on {day}: no input VAT recorded.'
    concentration:
      title: '{client}: {percent} % of revenue'
      why: 'Concentration risk: one client makes up most revenue of the last 12 months.'
    concentration_pension:
      title: '{client}: {percent} % of revenue'
      why: 'More than 5/6 of revenue from one client: check German pension insurance duty (§ 2 Nr. 9 SGB VI).'
  snipe:
    warranty:
      title: Warranty of {asset} ends on {day}
      why: Asset {tag}. Extend or plan a replacement.
    eol:
      title: '{asset} reached end of life'
      why: EOL date {day} ({tag}). Plan a replacement.
    license:
      title: Licence {license} expires on {day}
      why: Renew or cancel.
    seats:
      title: '{license}: no free seats'
      why: All {seats} seats are assigned.
    audit:
      title: 'Audit overdue: {asset}'
      why: The next audit date has passed.
    stock:
      title: '{item}: only {left} left'
      why: Minimum stock {min}.
    unused:
      title: '{asset} unused for {days} days'
      why: Ready to deploy but not assigned. Sell or use it?
    gwg:
      title: '{asset}: {net} net'
      why: 'Above 800 € net: check depreciation instead of immediate write-off (GWG).'
    expense_missing:
      title: No expense for {asset}
      why: Bought on {day} for {amount}, no matching expense in Invoice Ninja.
  geo:
    visit_without_time:
      title: '{customer} on {day}: no time booked'
      why: Dawarich shows {hours} h on site, Kimai has no entry for this client.
    time_without_visit:
      title: On-site booking without visit ({day})
      why: Kimai entry at {customer} marked on site, Dawarich shows no stay.
    travel_costs:
      title: 'Travel costs {month}: {amount}'
      why: '{trips} trips, about {km} km. Record as expense or invoice item.'
    per_diem:
