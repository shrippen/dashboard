{% extends "auth/_frame.html" %}
{% block box %}
<h1>{{ t('totp.title') }}</h1>
{% if error %}<div class="callout callout-danger">{{ t(error) }}</div>{% endif %}
<form method="post" action="/login/totp" class="stack">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="code">{{ t('totp.code') }}</label><input class="input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></div>
  <p class="field-hint">{{ t('totp.recovery_hint') }}</p>
  <button class="btn btn-accent wide-btn" type="submit">{{ t('totp.submit') }}</button>
</form>
{% endblock %}
