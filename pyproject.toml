[project]
name = "dashboard"
version = "0.1.0"
description = "Multi-user start page and insights for Kimai, Invoice Ninja, Snipe-IT and Dawarich"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode[pil]>=7.4",
  "cryptography>=42",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "feedparser>=6.0",
  "nh3>=0.2",
  "babel>=2.15",
  "pyyaml>=6.0",
  "authlib>=1.3",
  "apprise>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
dashboard = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
