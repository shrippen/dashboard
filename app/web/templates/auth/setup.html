{% extends "auth/_frame.html" %}
{% block box %}
<h1>{{ t('setup.title') }}</h1>
<p class="muted">{{ t('setup.lead') }}</p>
{% if error %}<div class="callout callout-danger">{{ t(error) }}</div>{% endif %}
<form method="post" action="/setup" class="stack">
  <div class="field"><label for="code">{{ t('setup.code') }}</label><input class="input" id="code" name="code" required autocomplete="off"></div>
  <div class="field"><label for="email">{{ t('field.email') }}</label><input class="input" id="email" name="email" type="email" required value="{{ email or '' }}"></div>
  <div class="field"><label for="name">{{ t('field.name') }}</label><input class="input" id="name" name="name" value="{{ name or '' }}"></div>
  <div class="field"><label for="password">{{ t('field.password') }}</label><input class="input" id="password" name="password" type="password" minlength="12" autocomplete="new-password" required><span class="field-hint">{{ t('password.rules') }}</span></div>
  <div class="field"><label for="locale">{{ t('field.locale') }}</label><select class="select" id="locale" name="locale"><option value="de">Deutsch</option><option value="en">English</option></select></div>
  <button class="btn btn-accent wide-btn" type="submit">{{ t('setup.submit') }}</button>
</form>
{% endblock %}
