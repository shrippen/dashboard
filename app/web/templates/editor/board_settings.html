{% extends "base.html" %}
{% from "partials/macros.html" import head %}
{% block content %}
{{ head(t('edit.board_settings'), board.name) }}
<form method="post" action="/b/{{ board.id }}/settings" class="panel panel-grid">{{ csrf_input }}
  <input type="hidden" name="version" value="{{ board.version }}">
  <div class="field"><label>{{ t('field.name') }}</label><input class="input" name="name" value="{{ board.name }}" required></div>
  <div class="field"><label>{{ t('field.theme_forced') }}</label>
    <select class="select" name="theme_id"><option value="">{{ t('theme.none') }}</option>
    {% for th in theme_list %}<option value="{{ th.id }}"{% if board.theme_id == th.id %} selected{% endif %}>{{ th.name }}</option>{% endfor %}</select></div>
  {% if board.space.kind.value == 'team' %}
  <div class="field"><label>{{ t('field.min_role') }}</label>
    <select class="select" name="min_role"><option value="">{{ t('role.everyone') }}</option>
    {% for r in roles %}<option value="{{ r.value }}">{{ t('role.' ~ r.value) }}</option>{% endfor %}</select></div>
  {% endif %}
  <div class="wide row-actions"><button class="btn btn-accent" type="submit">{{ t('action.save') }}</button>
    <a class="btn btn-outline" href="/b/{{ board.id }}/export">{{ t('action.export') }}</a></div>
</form>
<form method="post" action="/b/{{ board.id }}/delete" class="panel" data-confirm="{{ t('edit.confirm_delete') }}">{{ csrf_input }}
  <button class="btn btn-outline danger" type="submit">{{ t('board.delete') }}</button>
</form>
{% endblock %}
