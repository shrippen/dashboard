<!doctype html>
<html lang="{{ lang }}">
<body style="margin:0;padding:24px;background:#141312;color:#ebdbb2;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.6">
  <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#2a2826;border-top:4px solid #fabd2f">
    <tr><td style="padding:24px 28px">
      <h1 style="margin:0 0 12px;font-family:Rajdhani,'Segoe UI',sans-serif;font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:#fbf1c7">{{ title }}</h1>
      {% for p in paragraphs %}<p style="margin:0 0 12px;color:#d5c4a1">{{ p }}</p>{% endfor %}
      {% if items %}<table role="presentation" width="100%" style="border-collapse:collapse;margin:8px 0 16px">
        {% for item in items %}<tr><td style="padding:6px 0;border-top:1px solid #3c3836;color:{{ item.color }};font-family:monospace;font-size:12px;width:90px">{{ item.label }}</td><td style="padding:6px 0;border-top:1px solid #3c3836;color:#ebdbb2">{{ item.text }}</td></tr>{% endfor %}
      </table>{% endif %}
      {% if button %}<p style="margin:20px 0 4px"><a href="{{ button.url }}" style="display:inline-block;background:#fabd2f;color:#141312;padding:10px 22px;font-weight:700;text-decoration:none;text-transform:uppercase;letter-spacing:.08em">{{ button.label }}</a></p>{% endif %}
    </td></tr>
  </table>
  <p style="max-width:560px;margin:12px auto 0;font-family:monospace;font-size:11px;color:#a89984">{{ footer }}</p>
</body>
</html>
